<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生登録</title>
</head>
<body>
<h1>受講生登録</h1>
<form th:action="@{/registerStudent}" th:object="${studentDetail}" method="post">
  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{student.name}" required/>
  </div>
  <div>
    <label>カナ名:</label>
    <input type="text" id="kanaName" th:field="*{student.kanaName}" required />
    </div>

  <div>
    <label>ニックネーム:</label>
    <input type="text" id="nickname" th:field="*{student.nickname}" required />
  </div>

  <div>
    <label>メール:</label>
    <input type="email"  id="email" th:field="*{student.email}" required />
  </div>

  <div>
    <label>地域:</label>
    <input type="text"  id="area" th:field="*{student.area}" required />
  </div>

      <div>
        <label>年齢:</label>
  <input type="number" id="age" th:field="*{student.age}" required/>
      </div>

  <div>
    <label>性別:</label>
    <select th:field="*{student.sex}">
      <option value="">未選択</option>
      <option value="F">F</option>
      <option value="M">M</option>
      <option value="Other">Other</option>
    </select>
    </div>

  <div>
    <label>備考:</label>
    <textarea th:field="*{student.remarks}"></textarea>
  </div>

      <hr>

      <div> th:each="course, stat : *{studentsCourses}">
        <label> for="courseName" th:for="studetCourse.__${stat.index}__.courseName">受講コース名: </label>
        <input type="text" id="courseName" th:id="studentCourse.__${stat.index}__.courseName"
               th:field="*{studentsCourses[__${stat.index}__].courseName}"/>
      </div>

    <button type="submit">登録</button>
      </div>
</form>
</body>
</html>
