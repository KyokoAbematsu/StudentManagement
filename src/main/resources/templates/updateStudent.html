<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>受講生詳細</title>
</head>
<body>
<h1>受講生詳細</h1>

<form th:action="@{/updateStudent}" th:object="${studentDetail}" method="post">

  <div>
    <label for="id">ID:</label>
    <input type="text" id="id" th:field="*{student.id}" required />
  </div>

  <div>
    <label for="name">名前:</label>
    <input type="text" id="name" th:field="*{student.name}" required />
  </div>

  <div>
    <label for="nameKana">カナ名:</label>
    <input type="text" id="nameKana" th:field="*{student.nameKana}" required />
  </div>

  <div>
    <label for="nickName">ニックネーム:</label>
    <input type="text" id="nickName" th:field="*{student.nickName}" required />
  </div>

  <div>
    <label for="email">メール:</label>
    <input type="email" id="email" th:field="*{student.email}" required />
  </div>

  <div>
    <label for="region">地域:</label>
    <input type="text" id="region" th:field="*{student.region}" required />
  </div>

  <div>
    <label for="age">年齢:</label>
    <input type="number" id="age" th:field="*{student.age}" required />
  </div>

  <div>
    <label for="gender">性別:</label>
    <select id="gender" th:field="*{student.gender}">
      <option value="">未選択</option>
      <option value="F">F</option>
      <option value="M">M</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div>
    <label for="remarks">備考:</label>
    <input type="text" id="remarks" th:field="*{student.remarks}" />
  </div>
  <div>
    <label> for="isDeleted">キャンセル:</label>
      <input type="checkbox" id="isDeleted" th:field="*{student.deleted}"/>
  </div>

  <hr>

  <div th:each="course, stat : *{studentCourses}">
    <label for="studentCourseId"
           th:for="studentCourse.__${stat.index}__.id">受講コースID </label>
      <input type="text" id="studentCourseId" th:id="studentCourse.__${stat.index}__].id"
             th:field="*{studentsCourses[__${stat.index}__].id}"?>
    <label for="courseName"
           th:for="studentCourse.__${stat.index}__.courseName">受講コース名</label>
      <input type="text"id="courseName" th:field="*{studentCourses.__${stat.index}__.courseName"
      th:field="*{studentsCourses[__${stat.index}__].courseName}"/>
    </div>
  </div>

  <button type="submit">更新</button>
</form>
</body>
</html>
