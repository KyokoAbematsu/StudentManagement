<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>studentsdetails</title>
</head>
<body>
<h1>studentsdetails</h1>

<table border="1">
  <thead>
  <tr>
    <th>id</th>
    <th>Name</th>
    <th>kanaName</th>
    <th>nickname</th>
    <th>email</th>
    <th>area</th>
    <th>age</th>
    <th>sex</th>
    <th>remarks</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="student : ${studentList}">
    <td th:text="${student.student.id}">1</td>

    <td>
      <a th:href="@{/student/{id}(id=${student.student.id})}"
         th:text="${student.student.name}">YamadaTaro</a>
    </td>

    <td th:text="${student.student.nameKana}">YamadaTaro</td>
    <td th:text="${student.student.nickName}">taro-</td>
    <td th:text="${student.student.email}">taro@example.com</td>
    <td th:text="${student.student.region}">Tokyo</td>
    <td th:text="${student.student.age}">20</td>
    <td th:text="${student.student.gender}">men</td>
    <td th:text="${student.student.remarks}">Nothing</td>
  </tr>
  </tbody>
</table>
</body>
</html>
